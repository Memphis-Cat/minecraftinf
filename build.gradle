plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.diffplug.spotless' version '7.0.4'
    id 'checkstyle'
    id('io.github.opencubicchunks.javaheaders').version('1.2.8')
    id('io.github.opencubicchunks.gradle.mixingen')
    id('io.github.opencubicchunks.gradle.dasmgen')
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

javaHeaders {
    setAcceptedJars('.*CubicChunksCore.*')
    setConfig(file('javaHeaders.json'))
}

sourceSets {
    main {
        java {
            exclude 'io/github/opencubicchunks/cubicchunks/movetoforgesourcesetlater/**'
            exclude 'io/github/opencubicchunks/cubicchunks/mixin/core/forge/**'
        }
    }
}

dasmGen {
    filePattern = '%s.dasm.json'
    defaultMinVersion = '0.8'
    config(sourceSets.main, 'cubicchunks') {
        packageName = 'io.github.opencubicchunks.cubicchunks'
    }
}

mixinGen {
    filePattern = 'cubicchunks.mixins.%s.json'
    defaultPackagePrefix = 'io.github.opencubicchunks.cubicchunks.mixin'
    defaultCompatibilityLevel = 'JAVA_25'
    defaultMinVersion = '0.8'

    config(sourceSets.main, 'core') {
        required = true
        conformVisibility = true
        injectorsDefaultRequire = 1
        configurationPlugin = 'io.github.opencubicchunks.cubicchunks.mixin.ASMConfigPlugin'
    }
    config(sourceSets.main, 'access') {
        required = true
        conformVisibility = true
        injectorsDefaultRequire = 1
    }
}

loom {
    accessWidenerPath = file('src/main/resources/cubicchunks.accesswidener')
    runs {
        client {
            client()
            ideConfigGenerated = true
        }
        server {
            server()
            ideConfigGenerated = true
            programArgs '--nogui'
        }
    }
    mods {
        cubicchunks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.daporkchop.net/snapshot/' }
    maven { url = 'https://maven.daporkchop.net/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url = 'https://jitpack.io' }
}

def javaHeadersLinked = org.gradle.api.attributes.Attribute.of('javaHeadersLinked', Boolean)

configurations {
    libraries
    implementation.extendsFrom libraries
    cubicCoreHeaders {
        canBeConsumed = false
        canBeResolved = true
        attributes.attribute(javaHeadersLinked, true)
    }
}

// javaheaders 1.2.8 opts every resolvable configuration into its artifact
// transform. Loom's Minecraft 26.2 artifacts must remain untouched; only the
// CubicChunksCore header jar is eligible for the redirect transform.
configurations.configureEach {
    if (canBeResolved && name != 'cubicCoreHeaders') {
        attributes.attribute(javaHeadersLinked, false)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    cubicCoreHeaders(project(':CubicChunksCore')) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
        transitive = false
    }

    compileOnly 'io.github.notstirred:dasm:3.2.0:api'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    libraries 'io.github.opencubicchunks:regionlib:0.63.0-SNAPSHOT'
    libraries 'org.spongepowered:noise:2.0.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.compileClasspath += configurations.cubicCoreHeaders
sourceSets.main.runtimeClasspath += configurations.cubicCoreHeaders

tasks.register('printMainCompileClasspath') {
    group = 'verification'
    doLast {
        sourceSets.main.compileClasspath.files.toList().sort().each { println it }
    }
}

tasks.register('generatePackageInfo') {
    group = 'filegen'
    doFirst {
        for (final def sourceSet in project.sourceSets) {
            io.github.opencubicchunks.gradle.GeneratePackageInfo.generateFiles(sourceSet)
        }
    }
}

tasks.register('genAll') {
    group = 'filegen'
    dependsOn tasks.named('generatePackageInfo'), tasks.named('generateMixinConfigs'), tasks.named('generateDasmConfigs')
}

sourceSets.main.resources.srcDir 'src/generated/resources'
processResources.dependsOn tasks.named('genAll'), ':CubicChunksCore:assemble'
compileJava.dependsOn ':CubicChunksCore:assemble'

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    enabled = false
}

spotless {
    java {
        target 'src/*/java/**/*.java', 'buildSrc/src/*/java/**/*.java'
        eclipse().configFile('config/eclipse_formatter.xml')
        importOrder('\\#', 'java', 'javax', '')
        removeUnusedImports()
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
