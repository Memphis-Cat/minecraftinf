plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.diffplug.spotless' version '7.0.4'
    id 'checkstyle'
    id('io.github.opencubicchunks.gradle.mixingen')
    id('io.github.opencubicchunks.gradle.dasmgen')
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

sourceSets {
    main {
        java {
            exclude 'io/github/opencubicchunks/cubicchunks/movetoforgesourcesetlater/**'
            exclude 'io/github/opencubicchunks/cubicchunks/mixin/core/forge/**'
        }
    }
}

dasmGen {
    filePattern = '%s.dasm.json'
    defaultMinVersion = '0.8'
    config(sourceSets.main, 'cubicchunks') {
        packageName = 'io.github.opencubicchunks.cubicchunks'
    }
}

mixinGen {
    filePattern = 'cubicchunks.mixins.%s.json'
    defaultPackagePrefix = 'io.github.opencubicchunks.cubicchunks.mixin'
    defaultCompatibilityLevel = 'JAVA_25'
    defaultMinVersion = '0.8'

    config(sourceSets.main, 'core') {
        required = true
        conformVisibility = true
        injectorsDefaultRequire = 1
        configurationPlugin = 'io.github.opencubicchunks.cubicchunks.mixin.ASMConfigPlugin'
    }
    config(sourceSets.main, 'access') {
        required = true
        conformVisibility = true
        injectorsDefaultRequire = 1
    }
}

loom {
    // Minecraft 26.2 is already distributed in its public namespace. Loom's
    // processed named-jar path currently collapses this project's compile jar
    // to the resources-only side when any game-jar processor is registered.
    // Keep the unmodified 10k+ class distribution for compilation. Fabric
    // Loader still applies cubicchunks.accesswidener from fabric.mod.json at
    // runtime, while source-only visibility is handled with mixin accessors.
    enableTransitiveAccessWideners = false
    enableModProvidedJavadoc = false
    interfaceInjection {
        isEnabled = false
        enableDependencyInterfaceInjection = false
    }

    runs {
        client {
            client()
            ideConfigGenerated = true
        }
        server {
            server()
            ideConfigGenerated = true
            programArgs '--nogui'
        }
    }
    mods {
        cubicchunks {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.daporkchop.net/snapshot/' }
    maven { url = 'https://maven.daporkchop.net/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url = 'https://jitpack.io' }
}

configurations {
    libraries
    implementation.extendsFrom libraries
}

def linkedCoreJar = file("${buildDir}/fabric-header-libs/CubicChunksCore-linked.jar")

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    implementation files(linkedCoreJar)
    include files(linkedCoreJar)

    compileOnly 'io.github.notstirred:dasm:3.2.0:api'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    libraries 'io.github.opencubicchunks:regionlib:0.63.0-SNAPSHOT'
    libraries 'org.spongepowered:noise:2.0.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def requireLinkedCore = tasks.register('requireLinkedCore') {
    group = 'verification'
    description = 'Verifies that CubicChunksCore was linked by .github/link-cubic-core.sh before Loom starts.'
    doLast {
        if (!linkedCoreJar.isFile() || linkedCoreJar.length() == 0L) {
            throw new GradleException("Missing ${linkedCoreJar}. Build CubicChunksCore, then run .github/link-cubic-core.sh before Gradle.")
        }
    }
}

tasks.register('printMainCompileClasspath') {
    group = 'verification'
    dependsOn requireLinkedCore
    doLast {
        println "loom.disableObfuscation=${loom.disableObfuscation()}"
        println "loom.enableTransitiveAccessWideners=${loom.enableTransitiveAccessWideners.get()}"
        println "loom.enableModProvidedJavadoc=${loom.enableModProvidedJavadoc.get()}"
        println "loom.interfaceInjection=${loom.interfaceInjection.isEnabled()}"
        sourceSets.main.compileClasspath.files.toList().sort().each { println it }
    }
}

tasks.register('generatePackageInfo') {
    group = 'filegen'
    doFirst {
        for (final def sourceSet in project.sourceSets) {
            io.github.opencubicchunks.gradle.GeneratePackageInfo.generateFiles(sourceSet)
        }
    }
}

tasks.register('genAll') {
    group = 'filegen'
    dependsOn tasks.named('generatePackageInfo'), tasks.named('generateMixinConfigs'), tasks.named('generateDasmConfigs')
}

sourceSets.main.resources.srcDir 'src/generated/resources'
processResources.dependsOn tasks.named('genAll'), requireLinkedCore
compileJava.dependsOn requireLinkedCore

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    enabled = false
}

spotless {
    java {
        target 'src/*/java/**/*.java', 'buildSrc/src/*/java/**/*.java'
        eclipse().configFile('config/eclipse_formatter.xml')
        importOrder('\\#', 'java', 'javax', '')
        removeUnusedImports()
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
