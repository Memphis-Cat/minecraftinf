name: Fabric 26.2 Port CI

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Set up Java 17 for CubicChunksCore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build CubicChunksCore before Loom configuration
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore clean assemble --stacktrace --no-daemon 2>&1 | tee fabric-core-build.log
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar

      - name: Restore Java 25 for Minecraft 26.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Resolve Fabric compile classpath
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew printMainCompileClasspath dependencies --configuration compileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-classpath.log

      - name: Verify the official standalone Loom 26.2 template
        run: |
          chmod +x .github/fabric-loom-probe.sh
          .github/fabric-loom-probe.sh

      - name: Inspect Minecraft 26.2 classes
        run: |
          set -euo pipefail
          minecraft_jar="$(find .gradle/loom-cache/minecraftMaven -type f -name 'minecraft-merged-*.jar' | head -n 1)"
          test -n "$minecraft_jar"
          {
            echo "Minecraft jar: $minecraft_jar"
            ls -lh "$minecraft_jar"
            file "$minecraft_jar"
            sha256sum "$minecraft_jar"
            echo "Total entries: $(unzip -Z1 "$minecraft_jar" | wc -l)"
            echo "Class entries: $(unzip -Z1 "$minecraft_jar" | grep -c '\\.class$' || true)"
            echo
            echo "First jar entries:"
            unzip -Z1 "$minecraft_jar" | head -n 300 || true
            echo
            echo "Java runtime:"
            java -version 2>&1
            echo
            echo "Manifest:"
            unzip -p "$minecraft_jar" META-INF/MANIFEST.MF || true
            echo
            echo "First class entries in the jar:"
            jar tf "$minecraft_jar" | grep '\.class$' | head -n 300 || true
            echo
            echo "Representative matching entries:"
            jar tf "$minecraft_jar" | grep -E '(^|/)(BlockPos|Identifier|ResourceLocation|Level|ChunkAccess|StreamCodec|FriendlyByteBuf|CustomPacketPayload)\.class$' | sort | head -n 300 || true
            echo
            echo "First net/minecraft class entries:"
            jar tf "$minecraft_jar" | grep '^net/minecraft/.*\.class$' | sort | head -n 300 || true
            echo
            echo "Direct entry probes:"
            for entry in \
              net/minecraft/core/BlockPos.class \
              net/minecraft/resources/Identifier.class \
              net/minecraft/resources/ResourceLocation.class \
              net/minecraft/world/level/Level.class \
              net/minecraft/world/level/chunk/ChunkAccess.class \
              net/minecraft/network/codec/StreamCodec.class \
              net/minecraft/network/FriendlyByteBuf.class; do
              if unzip -Z1 "$minecraft_jar" | grep -Fxq "$entry"; then
                echo "FOUND $entry"
              else
                echo "MISSING $entry"
              fi
            done
          } | tee fabric-minecraft-classes.log

      - name: Compile Fabric 26.2 sources
        run: |
          set -euo pipefail
          ./gradlew compileJava --stacktrace --no-daemon 2>&1 | tee fabric-compile.log

      - name: Build Fabric jar
        run: |
          set -euo pipefail
          ./gradlew build -x test --stacktrace --no-daemon 2>&1 | tee fabric-build.log

      - name: Start Fabric dedicated server
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=fabric-26-2-smoke-world
          motd=CubicChunks Fabric 26.2 Smoke Test
          PROPERTIES
          : > fabric-server.log
          setsid ./gradlew runServer --stacktrace --no-daemon >fabric-server.log 2>&1 &
          process_group=$!
          cleanup() {
            kill -INT -- "-$process_group" >/dev/null 2>&1 || true
            sleep 3
            kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
            wait "$process_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' fabric-server.log; then
              exit 0
            fi
            if ! kill -0 "$process_group" >/dev/null 2>&1; then
              cat fabric-server.log
              exit 1
            fi
            sleep 1
          done
          cat fabric-server.log
          exit 1

      - name: Create exact source snapshot
        if: always()
        run: |
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='**/build' \
            --exclude='**/.gradle' \
            -czf /tmp/fabric-port-source.tar.gz .
          mv /tmp/fabric-port-source.tar.gz fabric-port-source.tar.gz

      - name: Upload Fabric port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-port-diagnostics
          path: |
            fabric-core-build.log
            fabric-classpath.log
            fabric-standalone-loom-probe.log
            fabric-standalone-loom-jars.log
            fabric-minecraft-classes.log
            fabric-compile.log
            fabric-build.log
            fabric-server.log
            fabric-port-source.tar.gz
            build/reports/
            build/libs/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
