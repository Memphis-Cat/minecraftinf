name: Fabric 26.2 Port CI

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Compile Fabric 26.2 sources
        run: |
          chmod +x gradlew
          ./gradlew compileJava --stacktrace --no-daemon 2>&1 | tee fabric-compile.log

      - name: Build Fabric jar
        run: ./gradlew build -x test --stacktrace --no-daemon 2>&1 | tee fabric-build.log

      - name: Upload Fabric port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-port-diagnostics
          path: |
            fabric-compile.log
            fabric-build.log
            build/reports/
            build/libs/
          if-no-files-found: ignore
          retention-days: 7
