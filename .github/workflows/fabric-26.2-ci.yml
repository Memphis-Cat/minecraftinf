name: Fabric 26.2 Port CI

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Inspect Mojang's Minecraft 26.2 distribution
        run: python .github/inspect-minecraft-distribution.py

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Set up Java 17 for CubicChunksCore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore clean assemble --stacktrace --no-daemon 2>&1 | tee fabric-core-build.log
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar

      - name: Restore Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Link CubicChunksCore outside the Loom build
        run: |
          set -euo pipefail
          chmod +x .github/link-cubic-core.sh
          .github/link-cubic-core.sh 2>&1 | tee fabric-core-link.log
          test -s build/fabric-header-libs/CubicChunksCore-linked.jar

      - name: Purge stale Loom snapshots
        run: |
          rm -rf .gradle/loom-cache
          rm -rf ~/.gradle/caches/fabric-loom
          rm -rf ~/.gradle/caches/modules-2/files-2.1/net.fabricmc/fabric-loom
          rm -rf ~/.gradle/caches/modules-2/files-2.1/net.fabricmc/fabric-loom.gradle.plugin
          rm -rf ~/.gradle/caches/modules-2/metadata-*/descriptors/net.fabricmc/fabric-loom*

      - name: Verify a clean standalone Loom 1.17 setup
        run: |
          chmod +x .github/fabric-loom-probe.sh
          .github/fabric-loom-probe.sh

      - name: Resolve Fabric compile classpath
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --refresh-dependencies printMainCompileClasspath dependencies --configuration compileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-classpath.log

      - name: Inspect Loom Minecraft artifacts
        run: |
          set -euo pipefail
          : > fabric-minecraft-classes.log
          find .gradle/loom-cache -type f -name '*.jar' -print0 | while IFS= read -r -d '' jar_path; do
            size="$(stat -c '%s' "$jar_path")"
            entries="$(unzip -Z1 "$jar_path" 2>/dev/null | wc -l || true)"
            classes="$(unzip -Z1 "$jar_path" 2>/dev/null | grep -c '\.class$' || true)"
            printf '%s entries=%s classes=%s %s\n' "$size" "$entries" "$classes" "$jar_path"
          done | sort -n | tee fabric-minecraft-classes.log
          minecraft_jar="$(find .gradle/loom-cache/minecraftMaven -type f -name 'minecraft-merged-*.jar' -print -quit)"
          test -n "$minecraft_jar"
          test "$(unzip -Z1 "$minecraft_jar" | grep -c '\.class$')" -gt 10000

      - name: Compile Fabric 26.2 sources
        run: |
          set -euo pipefail
          ./gradlew compileJava --stacktrace --no-daemon 2>&1 | tee fabric-compile.log

      - name: Build Fabric jar
        run: |
          set -euo pipefail
          ./gradlew build -x test --stacktrace --no-daemon 2>&1 | tee fabric-build.log
          test -n "$(find build/libs -maxdepth 1 -type f -name 'cubicchunks-*.jar' ! -name '*-sources.jar' -print -quit)"

      - name: Start, stop, and restart Fabric dedicated server
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=fabric-26-2-smoke-world
          motd=CubicChunks Fabric 26.2 Persistence Test
          PROPERTIES

          run_server() {
            local log_file="$1"
            : > "$log_file"
            setsid ./gradlew runServer --stacktrace --no-daemon >"$log_file" 2>&1 &
            local process_group=$!
            for _ in $(seq 1 360); do
              if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' "$log_file"; then
                kill -INT -- "-$process_group" >/dev/null 2>&1 || true
                for _ in $(seq 1 120); do
                  if ! kill -0 "$process_group" >/dev/null 2>&1; then
                    wait "$process_group" >/dev/null 2>&1 || true
                    return 0
                  fi
                  sleep 1
                done
                kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
                wait "$process_group" >/dev/null 2>&1 || true
                echo 'Server did not stop cleanly' >&2
                return 1
              fi
              if ! kill -0 "$process_group" >/dev/null 2>&1; then
                cat "$log_file"
                wait "$process_group" || true
                return 1
              fi
              sleep 1
            done
            cat "$log_file"
            kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
            wait "$process_group" >/dev/null 2>&1 || true
            return 1
          }

          run_server fabric-server-first.log
          test -d run/fabric-26-2-smoke-world
          find run/fabric-26-2-smoke-world -type f -print | sort > fabric-world-first.txt
          test -s fabric-world-first.txt
          run_server fabric-server-second.log
          find run/fabric-26-2-smoke-world -type f -print | sort > fabric-world-second.txt
          test -s fabric-world-second.txt

      - name: Create exact source snapshot
        if: always()
        run: |
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='**/build' \
            --exclude='**/.gradle' \
            -czf /tmp/fabric-port-source.tar.gz .
          mv /tmp/fabric-port-source.tar.gz fabric-port-source.tar.gz

      - name: Upload Fabric port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-port-diagnostics
          path: |
            fabric-minecraft-distribution.log
            fabric-core-build.log
            fabric-core-link.log
            fabric-standalone-loom-probe.log
            fabric-standalone-loom-jars.log
            fabric-classpath.log
            fabric-minecraft-classes.log
            fabric-compile.log
            fabric-build.log
            fabric-server-first.log
            fabric-server-second.log
            fabric-world-first.txt
            fabric-world-second.txt
            fabric-port-source.tar.gz
            build/reports/
            build/libs/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
