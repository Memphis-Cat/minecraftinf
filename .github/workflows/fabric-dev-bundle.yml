name: Fabric 26.2 Developer Bundle

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-dev-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Set up Java 17 for CubicChunksCore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        run: |
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore clean assemble --no-daemon

      - name: Restore Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve sources and compile classpath
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf .gradle/loom-cache
          ./gradlew --refresh-dependencies genSources printMainCompileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-dev-bundle.log
          find .gradle/loom-cache -type f \( -name '*.jar' -o -name '*.tiny' \) -print | sort > fabric-dev-bundle-files.txt
          tar -czf fabric-minecraft-dev-bundle.tar.gz \
            .gradle/loom-cache \
            build/fabric-header-libs \
            CubicChunksCore/build/libs \
            fabric-dev-bundle-files.txt

      - name: Upload developer bundle
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-developer-bundle
          path: |
            fabric-minecraft-dev-bundle.tar.gz
            fabric-dev-bundle.log
            fabric-dev-bundle-files.txt
          retention-days: 2
