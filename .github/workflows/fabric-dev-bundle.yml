name: Fabric 26.2 Developer Bundle

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-dev-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Set up Java 17 for CubicChunksCore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore clean assemble --no-daemon
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar

      - name: Restore Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Link CubicChunksCore outside the Loom build
        run: |
          set -euo pipefail
          chmod +x .github/link-cubic-core.sh
          .github/link-cubic-core.sh 2>&1 | tee fabric-core-link.log
          test -s build/fabric-header-libs/CubicChunksCore-linked.jar

      - name: Resolve sources and compile classpath
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf .gradle/loom-cache
          ./gradlew --refresh-dependencies genSources printMainCompileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-dev-bundle.log

          cache_roots=("$HOME/.gradle/caches/fabric-loom" ".gradle/loom-cache")
          minecraft_jar="$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar"
          test -s "$minecraft_jar"
          test "$(unzip -Z1 "$minecraft_jar" | grep -c '\.class$')" -gt 10000

          bundle_dir='fabric-26.2-dev-files'
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir/minecraft" "$bundle_dir/core"
          : > fabric-dev-bundle-files.txt

          copy_with_manifest() {
            local source_path="$1"
            local target_dir="$2"
            local digest
            digest="$(sha256sum "$source_path" | cut -d' ' -f1)"
            local target_path="$target_dir/${digest:0:16}-$(basename "$source_path")"
            cp "$source_path" "$target_path"
            printf '%s -> %s\n' "$source_path" "$target_path" >> fabric-dev-bundle-files.txt
          }

          copy_with_manifest "$minecraft_jar" "$bundle_dir/minecraft"
          while IFS= read -r source_path; do
            copy_with_manifest "$source_path" "$bundle_dir/minecraft"
          done < <(find "${cache_roots[@]}" -type f \( -name '*sources*.jar' -o -name '*source*.jar' -o -name '*.tiny' \) -print 2>/dev/null | sort -u)

          copy_with_manifest build/fabric-header-libs/CubicChunksCore-linked.jar "$bundle_dir/core"
          copy_with_manifest CubicChunksCore/build/libs/CubicChunksCore.jar "$bundle_dir/core"
          cp fabric-dev-bundle-files.txt "$bundle_dir/manifest.txt"
          tar -czf fabric-minecraft-dev-bundle.tar.gz "$bundle_dir"
          test -s fabric-minecraft-dev-bundle.tar.gz

      - name: Upload developer bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-developer-bundle
          path: |
            fabric-minecraft-dev-bundle.tar.gz
            fabric-dev-bundle.log
            fabric-core-link.log
            fabric-dev-bundle-files.txt
          if-no-files-found: ignore
          retention-days: 2
