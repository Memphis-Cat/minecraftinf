name: Apply Cube Storage Baseline

on:
  push:
    branches:
      - agent/cubicchunks3-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('patches/0002-mixin-cube-storage.patch') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patches/0002-mixin-cube-storage.patch
          git apply patches/0002-mixin-cube-storage.patch
          ./gradlew spotlessApply --no-daemon

      - name: Commit source and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/common/server/level/MixinChunkMap.java
          git add src/main/java/io/github/opencubicchunks/cubicchunks/world/storage/CubeStorage.java
          git rm patches/0002-mixin-cube-storage.patch
          git rm .github/workflows/apply-cube-storage-baseline.yml
          git commit -m 'Persist full cube section data'
          git push origin HEAD:agent/cubicchunks3-phase1
