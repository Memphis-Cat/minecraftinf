name: Fabric 26.2 Full Compiler Diagnostics

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-full-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  compile-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out port branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply deterministic migrations
        shell: bash
        run: |
          set -euo pipefail
          python .github/inspect-minecraft-distribution.py
          python .github/fabric-gradle9-migrate.py
          python .github/fabric-api26-source-migrate.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          chmod +x gradlew .github/link-cubic-core.sh

      - name: Prepare Core and Minecraft compile headers
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :CubicChunksCore:clean :CubicChunksCore:assemble :CubicChunksCore:testsJar --stacktrace --no-daemon
          .github/link-cubic-core.sh
          ./gradlew --refresh-dependencies printMainCompileClasspath --stacktrace --no-daemon

      - name: Capture complete compiler diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          ./gradlew compileJava compileTestJava --stacktrace --no-daemon > fabric-full-compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('fabric-full-compile.log').read_text(encoding='utf-8', errors='replace').splitlines()
          blocks = []
          seen = set()
          for index, line in enumerate(source):
              if ' error:' not in line and not re.search(r'^error:', line):
                  continue
              start = max(0, index - 2)
              end = min(len(source), index + 7)
              block = '\n'.join(source[start:end])
              if block not in seen:
                  seen.add(block)
                  blocks.append(block)
          output = '\n\n---\n\n'.join(blocks)
          Path('fabric-compiler-errors.txt').write_text(output + ('\n' if output else ''), encoding='utf-8')
          print(f'Captured {len(blocks)} distinct compiler error blocks')
          PY
          exit 0

      - name: Upload complete compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-full-compiler-diagnostics
          path: |
            fabric-full-compile.log
            fabric-compiler-errors.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report compiler diagnostics on pull request 2
        if: always()
        uses: actions/github-script@v7
        env:
          COMPILE_STATUS: ${{ steps.compile.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cubicchunks-fabric-26.2-full-diagnostics -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let errors = fs.existsSync('fabric-compiler-errors.txt')
              ? fs.readFileSync('fabric-compiler-errors.txt', 'utf8')
              : 'Compiler error extraction was not produced.';
            if (errors.length > 54000) errors = errors.slice(0, 54000) + '\n\n[remaining errors are in the workflow artifact]';
            const body = `${marker}\n## Fabric 26.2 full compiler diagnostics\n\nRun ID: \`${context.runId}\`  \nRun: ${runUrl}  \nCompiler exit code: \`${process.env.COMPILE_STATUS || 'unknown'}\`\n\n<details open><summary>Distinct compiler errors</summary>\n\n\`\`\`text\n${errors}\n\`\`\`\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body
              });
            }

      - name: Fail when compilation failed
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: exit 1
