name: Fabric 26.2 API Migration

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-api26-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-migrated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Minecraft 26.2 source migration
        run: python .github/fabric-api26-source-migrate.py

      - name: Migrate custom generators to Gradle 9
        run: python .github/fabric-gradle9-migrate.py

      - name: Set up Java 17 for CubicChunksCore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore clean assemble --stacktrace --no-daemon 2>&1 | tee fabric-api26-core.log
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Link CubicChunksCore outside Loom
        run: |
          set -euo pipefail
          chmod +x .github/link-cubic-core.sh
          .github/link-cubic-core.sh 2>&1 | tee fabric-api26-link.log
          test -s build/fabric-header-libs/CubicChunksCore-linked.jar

      - name: Resolve Fabric classpath
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --refresh-dependencies printMainCompileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-api26-classpath.log

      - name: Compile migrated Fabric sources
        run: |
          set -euo pipefail
          ./gradlew compileJava --stacktrace --no-daemon 2>&1 | tee fabric-api26-compile.log

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-api-migration-diagnostics
          path: |
            fabric-api26-core.log
            fabric-api26-link.log
            fabric-api26-classpath.log
            fabric-api26-compile.log
            build/reports/
          if-no-files-found: ignore
          retention-days: 5
