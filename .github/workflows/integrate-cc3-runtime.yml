name: Integrate CubicChunks Runtime Batch

on:
  push:
    branches:
      - agent/cubicchunks3-phase1
    paths:
      - '.github/cc3-runtime-complete.patch.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-cc3-runtime
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Stop when the patch was already integrated
        id: patch
        run: |
          if compgen -G '.github/cc3-runtime-complete.patch.*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.patch.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        if: steps.patch.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Apply source batch
        if: steps.patch.outputs.present == 'true'
        run: |
          chmod +x gradlew
          cat .github/cc3-runtime-complete.patch.* > /tmp/cc3-runtime-complete.patch
          git apply --index /tmp/cc3-runtime-complete.patch

      - name: Format source
        if: steps.patch.outputs.present == 'true'
        run: ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Compile and run static checks
        if: steps.patch.outputs.present == 'true'
        run: ./gradlew build -x test --stacktrace --no-daemon

      - name: Run runtime unit tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.test.*'
          --tests 'io.github.opencubicchunks.cubicchunks.world.level.cube.status.TestCubeColumnBridge'
          --stacktrace --no-daemon

      - name: Run ServerCubeCache integration tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestServerCubeCache'
          --stacktrace --no-daemon

      - name: Run bounded ChunkMap integration tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestCubicChunkMap'
          --stacktrace --no-daemon

      - name: Commit validated source
        if: steps.patch.outputs.present == 'true'
        run: |
          git rm .github/cc3-runtime-complete.patch.*
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete cube runtime and persistence paths'
          git push origin HEAD:agent/cubicchunks3-phase1

      - name: Upload validation reports
        if: always() && steps.patch.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cc3-runtime-integration-reports
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
