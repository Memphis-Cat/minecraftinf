name: Build Pull Request

on: [ pull_request ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Tar post-build state
        run: tar -cvzpf /tmp/post-build.tar.gz .
      - name: Upload post-build state
        uses: actions/upload-artifact@v4
        with:
          name: post-build-state
          path: /tmp/post-build.tar.gz

  call-test:
    needs: build
    uses: ./.github/workflows/testJob.yml
    with:
      name: 'test'
      command: './gradlew check'

  call-cleanup:
    needs: [ call-test ]
    uses: ./.github/workflows/cleanupJob.yml
