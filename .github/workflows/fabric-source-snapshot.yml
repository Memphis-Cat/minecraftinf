name: Fabric Source Snapshot

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=.gradle \
            --exclude='**/build' \
            --exclude='**/.gradle' \
            -czf "$RUNNER_TEMP/fabric-port-source.tar.gz" .
          mv "$RUNNER_TEMP/fabric-port-source.tar.gz" fabric-port-source.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fabric-port-source
          path: fabric-port-source.tar.gz
          retention-days: 2

      - name: Report snapshot run on pull request 2
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cubicchunks-fabric-source-snapshot -->';
            const body = `${marker}\nFabric source snapshot run: \`${context.runId}\`  \nHead: \`${context.sha}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body
              });
            }
