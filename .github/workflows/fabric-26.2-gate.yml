name: CubicChunks3 Fabric 26.2 Gate

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fabric-26.2-gate.yml
  pull_request_target:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  migrate-validate-integrate:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/cubicchunks3-fabric-26.2')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Fabric port and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-fabric-26.2
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Apply deterministic Minecraft 26.2 migrations
        shell: bash
        run: |
          set -euo pipefail
          echo "BRANCH_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python .github/inspect-minecraft-distribution.py
          python .github/fabric-gradle9-migrate.py
          python .github/fabric-api26-source-migrate.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          chmod +x gradlew .github/link-cubic-core.sh

      - name: Build CubicChunksCore and its test archive
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :CubicChunksCore:clean :CubicChunksCore:assemble :CubicChunksCore:testsJar --stacktrace --no-daemon 2>&1 | tee fabric-core.log
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar
          test -s CubicChunksCore/build/libs/CubicChunksCore-tests.jar

      - name: Link core and prepare Minecraft headers
        shell: bash
        run: |
          set -euo pipefail
          .github/link-cubic-core.sh 2>&1 | tee fabric-link.log
          ./gradlew --refresh-dependencies printMainCompileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-classpath.log
          test -s build/fabric-header-libs/CubicChunksCore-linked.jar
          test -s build/fabric-header-libs/CubicChunksCore-tests-linked.jar
          test -s build/fabric-header-libs/minecraft-client-access-widened.jar

      - name: Compile runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava compileTestJava --stacktrace --no-daemon 2>&1 | tee fabric-compile.log

      - name: Run Fabric and CubicChunksCore tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test coreTest --stacktrace --no-daemon 2>&1 | tee fabric-test.log
          python - <<'PY' | tee fabric-test-summary.txt
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for task in ('test', 'coreTest'):
              files = sorted((Path('build/test-results') / task).glob('TEST-*.xml'))
              if not files:
                  raise SystemExit(f'{task} produced no JUnit XML results')
              tests = failures = errors = skipped = 0
              for file in files:
                  root = ET.parse(file).getroot()
                  tests += int(root.attrib.get('tests', 0))
                  failures += int(root.attrib.get('failures', 0))
                  errors += int(root.attrib.get('errors', 0))
                  skipped += int(root.attrib.get('skipped', 0))
              print(f'{task}: tests={tests} failures={failures} errors={errors} skipped={skipped}')
              if tests <= 0:
                  raise SystemExit(f'{task} executed zero tests')
              if failures or errors:
                  raise SystemExit(f'{task} contains failures or errors')
          PY

      - name: Build distributable Fabric jar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemble --stacktrace --no-daemon 2>&1 | tee fabric-build.log
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'cubicchunks-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -s "$jar_path"
          jar tf "$jar_path" | sort > fabric-jar.txt
          grep -q '^fabric.mod.json$' fabric-jar.txt
          grep -q '^cubicchunks.accesswidener$' fabric-jar.txt
          grep -q '^io/github/opencubicchunks/cubicchunks/CubicChunks.class$' fabric-jar.txt

      - name: Start stop restart and reload dedicated server
        shell: bash
        run: |
          set -euo pipefail
          world='fabric-26-2-final-world'
          rm -rf "run/$world"
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<PROPERTIES
          online-mode=false
          enable-rcon=true
          rcon.password=cubicchunks-ci
          rcon.port=25579
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=$world
          motd=CubicChunks Fabric 26.2 Final Gate
          PROPERTIES

          run_server() {
            local log_file="$1"
            : > "$log_file"
            setsid ./gradlew runServer --stacktrace --no-daemon </dev/null >"$log_file" 2>&1 &
            local group=$!
            for _ in $(seq 1 420); do
              if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' "$log_file"; then
                python .github/scripts/minecraft_rcon.py 'save-all flush' --host 127.0.0.1 --port 25579 --password cubicchunks-ci
                python .github/scripts/minecraft_rcon.py stop --host 127.0.0.1 --port 25579 --password cubicchunks-ci --allow-disconnect
                for _ in $(seq 1 180); do
                  if ! kill -0 "$group" >/dev/null 2>&1; then
                    wait "$group" >/dev/null 2>&1 || true
                    grep -Eq 'Saved the game|All dimensions are saved|Stopping server' "$log_file"
                    return 0
                  fi
                  sleep 1
                done
                cat "$log_file"
                kill -TERM -- "-$group" >/dev/null 2>&1 || true
                wait "$group" >/dev/null 2>&1 || true
                return 1
              fi
              if ! kill -0 "$group" >/dev/null 2>&1; then
                cat "$log_file"
                wait "$group" || true
                return 1
              fi
              sleep 1
            done
            cat "$log_file"
            kill -TERM -- "-$group" >/dev/null 2>&1 || true
            wait "$group" >/dev/null 2>&1 || true
            return 1
          }

          run_server fabric-server-first.log
          test -d "run/$world"
          find "run/$world" -type f -print | sort > fabric-world-first.txt
          test -s fabric-world-first.txt
          find "run/$world" -type f -name '*.ccube' -print | sort > fabric-cubes-first.txt
          test -s fabric-cubes-first.txt
          while IFS= read -r cube_file; do
            test -s "$cube_file"
          done < fabric-cubes-first.txt
          cp fabric-world-first.txt fabric-world-before-restart.txt
          cp fabric-cubes-first.txt fabric-cubes-before-restart.txt

          run_server fabric-server-second.log
          find "run/$world" -type f -print | sort > fabric-world-second.txt
          test -s fabric-world-second.txt
          find "run/$world" -type f -name '*.ccube' -print | sort > fabric-cubes-second.txt
          test -s fabric-cubes-second.txt
          while IFS= read -r cube_file; do
            test -s "$cube_file"
          done < fabric-cubes-second.txt
          comm -23 fabric-world-before-restart.txt fabric-world-second.txt > fabric-world-missing-after-restart.txt
          test ! -s fabric-world-missing-after-restart.txt
          comm -23 fabric-cubes-before-restart.txt fabric-cubes-second.txt > fabric-cubes-missing-after-restart.txt
          test ! -s fabric-cubes-missing-after-restart.txt
          grep -Eq 'Loaded persisted cube|Loaded persisted proto cube' fabric-server-second.log
          ! grep -Eqi 'crash report|failed to load|exception.*cubic|mixin apply failed|could not execute entrypoint' fabric-server-first.log
          ! grep -Eqi 'crash report|failed to load|exception.*cubic|mixin apply failed|could not execute entrypoint' fabric-server-second.log

      - name: Reject unfinished production stubs
        shell: bash
        run: |
          set -euo pipefail
          python .github/fabric-production-audit.py

      - name: Commit fully validated migrated runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/cubicchunks3-fabric-26.2
          if [[ "$(git rev-parse origin/agent/cubicchunks3-fabric-26.2)" != "$BRANCH_START" ]]; then
            echo 'Fabric branch moved during validation; refusing to overwrite it.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle buildSrc src/main/java src/main/resources src/test/java .github/widen-minecraft-headers.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The branch already contains the validated Minecraft 26.2 migration.'
            exit 0
          fi
          git commit -m 'Complete Minecraft 26.2 API migration'
          git push origin HEAD:agent/cubicchunks3-fabric-26.2

      - name: Upload Fabric completion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-final-gate
          path: |
            fabric-*.log
            fabric-*.txt
            build/reports/
            build/test-results/
            build/libs/
            run/logs/
            run/crash-reports/
            run/fabric-26-2-final-world/cubicchunks/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Report Fabric gate result on pull request 2
        if: always()
        uses: actions/github-script@v7
        env:
          GATE_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cubicchunks-fabric-26.2-gate -->';
            const files = [
              'fabric-core.log',
              'fabric-link.log',
              'fabric-classpath.log',
              'fabric-compile.log',
              'fabric-test.log',
              'fabric-test-summary.txt',
              'fabric-build.log',
              'fabric-server-first.log',
              'fabric-server-second.log',
              'fabric-world-missing-after-restart.txt',
              'fabric-cubes-first.txt',
              'fabric-cubes-second.txt',
              'fabric-cubes-missing-after-restart.txt'
            ];
            let body = `${marker}\n## Fabric 26.2 completion gate: **${process.env.GATE_STATUS}**\n\n`;
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
              const tail = lines.slice(-220).join('\n');
              if (!tail.trim()) continue;
              body += `<details><summary>${file} (last ${Math.min(lines.length, 220)} lines)</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>\n\n`;
            }
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n[truncated]';
            const issue_number = context.payload.pull_request?.number || 2;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
