name: Fabric 26.2 Migration Gate

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
  workflow_dispatch:

concurrency:
  group: cubicchunks3-fabric-26.2-migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out port branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Apply deterministic Minecraft 26.2 migrations
        shell: bash
        run: |
          set -euo pipefail
          echo "BRANCH_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python .github/inspect-minecraft-distribution.py
          python .github/fabric-gradle9-migrate.py
          python .github/fabric-api26-source-migrate.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          python .github/fabric-api26-finalize.py
          python .github/fabric-core-tests.py
          chmod +x gradlew .github/link-cubic-core.sh

      - name: Build CubicChunksCore and its test archive
        shell: bash
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          curl -fsSL -o /tmp/temurin17.tar.gz 'https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse'
          mkdir -p /tmp/temurin17
          tar -xzf /tmp/temurin17.tar.gz -C /tmp/temurin17 --strip-components=1
          (
            cd CubicChunksCore
            JAVA_HOME=/tmp/temurin17 PATH=/tmp/temurin17/bin:$PATH ./gradlew clean assemble testsJar --stacktrace --no-daemon
          ) 2>&1 | tee fabric-migration-core.log
          test -s CubicChunksCore/build/libs/CubicChunksCore.jar
          test -s CubicChunksCore/build/libs/CubicChunksCore-tests.jar

      - name: Link core and prepare Minecraft headers
        shell: bash
        run: |
          set -euo pipefail
          .github/link-cubic-core.sh 2>&1 | tee fabric-migration-link.log
          ./gradlew --refresh-dependencies printMainCompileClasspath --stacktrace --no-daemon 2>&1 | tee fabric-migration-classpath.log
          test -s build/fabric-header-libs/CubicChunksCore-linked.jar
          test -s build/fabric-header-libs/minecraft-client-access-widened.jar

      - name: Compile runtime and tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileJava compileTestJava --stacktrace --no-daemon 2>&1 | tee fabric-migration-compile.log

      - name: Run Fabric and CubicChunksCore tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test coreTest --stacktrace --no-daemon 2>&1 | tee fabric-migration-test.log
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for task in ('test', 'coreTest'):
              files = sorted((Path('build/test-results') / task).glob('TEST-*.xml'))
              if not files:
                  raise SystemExit(f'{task} produced no JUnit XML results')
              tests = failures = errors = skipped = 0
              for file in files:
                  root = ET.parse(file).getroot()
                  tests += int(root.attrib.get('tests', 0))
                  failures += int(root.attrib.get('failures', 0))
                  errors += int(root.attrib.get('errors', 0))
                  skipped += int(root.attrib.get('skipped', 0))
              print(f'{task}: tests={tests} failures={failures} errors={errors} skipped={skipped}')
              if tests <= 0:
                  raise SystemExit(f'{task} executed zero tests')
              if failures or errors:
                  raise SystemExit(f'{task} contains failures or errors')
          PY

      - name: Build distributable Fabric jar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemble --stacktrace --no-daemon 2>&1 | tee fabric-migration-build.log
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'cubicchunks-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -s "$jar_path"
          jar tf "$jar_path" | sort > fabric-migration-jar.txt
          grep -q '^fabric.mod.json$' fabric-migration-jar.txt
          grep -q '^cubicchunks.accesswidener$' fabric-migration-jar.txt
          grep -q '^io/github/opencubicchunks/cubicchunks/CubicChunks.class$' fabric-migration-jar.txt

      - name: Start stop restart and reload dedicated server
        shell: bash
        run: |
          set -euo pipefail
          world='fabric-26-2-migration-world'
          rm -rf "run/$world"
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<PROPERTIES
          online-mode=false
          enable-rcon=true
          rcon.password=cubicchunks-ci
          rcon.port=25579
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=$world
          motd=CubicChunks Fabric 26.2 Migration Gate
          PROPERTIES

          run_server() {
            local log_file="$1"
            : > "$log_file"
            setsid ./gradlew runServer --stacktrace --no-daemon </dev/null >"$log_file" 2>&1 &
            local group=$!
            for _ in $(seq 1 420); do
              if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' "$log_file"; then
                python .github/scripts/minecraft_rcon.py 'save-all flush' --host 127.0.0.1 --port 25579 --password cubicchunks-ci
                python .github/scripts/minecraft_rcon.py stop --host 127.0.0.1 --port 25579 --password cubicchunks-ci --allow-disconnect
                for _ in $(seq 1 180); do
                  if ! kill -0 "$group" >/dev/null 2>&1; then
                    wait "$group" >/dev/null 2>&1 || true
                    grep -Eq 'Saved the game|All dimensions are saved|Stopping server' "$log_file"
                    return 0
                  fi
                  sleep 1
                done
                cat "$log_file"
                kill -TERM -- "-$group" >/dev/null 2>&1 || true
                wait "$group" >/dev/null 2>&1 || true
                return 1
              fi
              if ! kill -0 "$group" >/dev/null 2>&1; then
                cat "$log_file"
                wait "$group" || true
                return 1
              fi
              sleep 1
            done
            cat "$log_file"
            kill -TERM -- "-$group" >/dev/null 2>&1 || true
            wait "$group" >/dev/null 2>&1 || true
            return 1
          }

          run_server fabric-migration-server-first.log
          test -d "run/$world"
          find "run/$world" -type f -print | sort > fabric-migration-world-first.txt
          test -s fabric-migration-world-first.txt
          cp fabric-migration-world-first.txt fabric-migration-world-before-restart.txt
          run_server fabric-migration-server-second.log
          find "run/$world" -type f -print | sort > fabric-migration-world-second.txt
          test -s fabric-migration-world-second.txt
          comm -23 fabric-migration-world-before-restart.txt fabric-migration-world-second.txt > fabric-migration-world-missing.txt
          test ! -s fabric-migration-world-missing.txt
          ! grep -Eqi 'crash report|failed to load|exception.*cubic|mixin apply failed|could not execute entrypoint' fabric-migration-server-first.log
          ! grep -Eqi 'crash report|failed to load|exception.*cubic|mixin apply failed|could not execute entrypoint' fabric-migration-server-second.log

      - name: Reject unfinished production stubs
        shell: bash
        run: |
          set -euo pipefail
          python .github/fabric-production-audit.py

      - name: Commit fully validated migrated runtime
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/cubicchunks3-fabric-26.2
          if [[ "$(git rev-parse origin/agent/cubicchunks3-fabric-26.2)" != "$BRANCH_START" ]]; then
            echo 'Port branch moved during validation; refusing to overwrite it.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle src/main/java src/main/resources .github/widen-minecraft-headers.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Validated tree already contains the Minecraft 26.2 migration.'
            exit 0
          fi
          git commit -m 'Complete Minecraft 26.2 API migration'
          git push origin HEAD:agent/cubicchunks3-fabric-26.2

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-migration-diagnostics
          path: |
            fabric-migration-*.log
            fabric-migration-*.txt
            build/reports/
            build/test-results/
            build/libs/
            run/logs/
            run/crash-reports/
            run/fabric-26-2-migration-world/cubicchunks/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Report gate result on pull request 2
        if: always()
        uses: actions/github-script@v7
        env:
          GATE_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cubicchunks-fabric-26.2-branch-gate -->';
            const files = [
              'fabric-migration-core.log',
              'fabric-migration-link.log',
              'fabric-migration-classpath.log',
              'fabric-migration-compile.log',
              'fabric-migration-test.log',
              'fabric-migration-build.log',
              'fabric-migration-server-first.log',
              'fabric-migration-server-second.log',
              'fabric-migration-world-missing.txt'
            ];
            let body = `${marker}\n## Fabric 26.2 branch gate: **${process.env.GATE_STATUS}**\n\n`;
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
              const tail = lines.slice(-220).join('\n');
              if (!tail.trim()) continue;
              body += `<details><summary>${file} (last ${Math.min(lines.length, 220)} lines)</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>\n\n`;
            }
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n[truncated]';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body
              });
            }