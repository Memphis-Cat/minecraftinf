name: Fabric 26.2 API Probe

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
    paths:
      - .github/workflows/fabric-26.2-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  storage-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        run: |
          set -euo pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore assemble --no-daemon

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve named Minecraft 26.2 jar
        run: |
          set -euo pipefail
          chmod +x gradlew .github/link-cubic-core.sh
          python .github/fabric-gradle9-migrate.py
          python .github/fabric-api26-source-migrate.py
          python .github/fabric-api26-finalize.py
          .github/link-cubic-core.sh
          ./gradlew --refresh-dependencies printMainCompileClasspath --no-daemon

      - name: Extract storage API signatures
        run: |
          set -euo pipefail
          jar="$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar"
          test -s "$jar"
          {
            echo '=== storage classes ==='
            jar tf "$jar" | grep '^net/minecraft/world/level/chunk/storage/.*\.class$' | sort
            echo
            for class in \
              net.minecraft.world.level.chunk.storage.ChunkStorage \
              net.minecraft.world.level.chunk.storage.IOWorker \
              net.minecraft.world.level.chunk.storage.RegionFileStorage \
              net.minecraft.world.level.chunk.storage.SimpleRegionStorage \
              net.minecraft.world.level.chunk.storage.ChunkScanAccess; do
              echo "=== $class ==="
              if jar tf "$jar" | grep -q "^${class//.//}\.class$"; then
                javap -classpath "$jar" -p -s "$class"
              else
                echo 'CLASS ABSENT'
              fi
              echo
            done
          } > fabric-26.2-storage-api.txt
          cat fabric-26.2-storage-api.txt

      - name: Report storage API on PR 2
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cubicchunks-fabric-26.2-api-probe -->';
            let output = fs.existsSync('fabric-26.2-storage-api.txt')
              ? fs.readFileSync('fabric-26.2-storage-api.txt', 'utf8')
              : 'The API probe failed before producing storage signatures.';
            if (output.length > 58000) output = output.slice(0, 58000) + '\n[truncated]';
            const body = `${marker}\n## Minecraft 26.2 storage API probe\n\n\`\`\`text\n${output}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-26.2-storage-api
          path: fabric-26.2-storage-api.txt
          if-no-files-found: ignore
