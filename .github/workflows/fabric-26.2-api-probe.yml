name: Fabric 26.2 API Probe

on:
  push:
    branches:
      - agent/cubicchunks3-fabric-26.2
    paths:
      - .github/workflows/fabric-26.2-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  storage-api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build CubicChunksCore
        shell: bash
        run: |
          set -o pipefail
          chmod +x CubicChunksCore/gradlew
          ./CubicChunksCore/gradlew -p CubicChunksCore assemble --stacktrace --no-daemon 2>&1 | tee fabric-26.2-api-probe.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve named Minecraft 26.2 jar
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew .github/link-cubic-core.sh
          {
            python .github/fabric-gradle9-migrate.py
            python .github/fabric-api26-source-migrate.py
            python .github/fabric-api26-finalize.py
            .github/link-cubic-core.sh
            ./gradlew --refresh-dependencies printMainCompileClasspath --stacktrace --no-daemon
          } 2>&1 | tee -a fabric-26.2-api-probe.log

      - name: Extract public API signatures
        shell: bash
        run: |
          set -o pipefail
          jar="$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar"
          {
            echo "jar=$jar"
            ls -l "$jar"
            echo
            echo '=== relevant classes ==='
            jar tf "$jar" | grep -E '^(net/minecraft/resources/ResourceKey|net/minecraft/world/level/ChunkPos|net/minecraft/world/level/chunk/storage/.*)\.class$' | sort
            echo
            for class in \
              net.minecraft.resources.ResourceKey \
              net.minecraft.world.level.ChunkPos \
              net.minecraft.world.level.chunk.storage.ChunkStorage \
              net.minecraft.world.level.chunk.storage.IOWorker \
              net.minecraft.world.level.chunk.storage.RegionFileStorage \
              net.minecraft.world.level.chunk.storage.SimpleRegionStorage \
              net.minecraft.world.level.chunk.storage.ChunkScanAccess; do
              echo "=== $class ==="
              if jar tf "$jar" | grep -q "^${class//.//}\.class$"; then
                javap -classpath "$jar" -p -s "$class"
              else
                echo 'CLASS ABSENT'
              fi
              echo
            done
          } 2>&1 | tee fabric-26.2-storage-api.txt

      - name: Report API probe on PR 2
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cubicchunks-fabric-26.2-api-probe -->';
            const files = ['fabric-26.2-api-probe.log', 'fabric-26.2-storage-api.txt'];
            let output = '';
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const text = fs.readFileSync(file, 'utf8');
              output += `=== ${file} ===\n${text.slice(-30000)}\n\n`;
            }
            if (!output) output = 'The API probe failed before creating a diagnostic log.';
            if (output.length > 59000) output = output.slice(-59000);
            const body = `${marker}\n## Minecraft 26.2 API probe\n\n\`\`\`text\n${output}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 2, body });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-26.2-api-probe
          path: |
            fabric-26.2-api-probe.log
            fabric-26.2-storage-api.txt
          if-no-files-found: ignore
