name: Apply production cube lifecycle completion batch

on:
  push:
    branches:
      - agent/cubicchunks3-phase1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply production implementations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              file.write_text(text.replace(old, new))

          # Client-level cube lifecycle contract.
          replace(
              "src/main/java/io/github/opencubicchunks/cubicchunks/client/multiplayer/CubicClientLevel.java",
              "    void cc_onCubeLoaded(CubePos cubePos);\n",
              "    void cc_onCubeLoaded(CubePos cubePos);\n\n    void cc_onCubeUnloaded(CubePos cubePos);\n",
          )

          # Client cache now owns load/unload notifications and renderer section transitions.
          path = Path("src/main/java/io/github/opencubicchunks/cubicchunks/client/multiplayer/ClientCubeCache.java")
          text = path.read_text()
          old = '''        public void replace(int chunkIndex, @Nullable LevelCube chunk) {
              LevelCube levelchunk = this.chunks.getAndSet(chunkIndex, chunk);
              if (levelchunk != null) {
                  --this.chunkCount;
                  this.dropEmptySections(levelchunk);
  //                this.level.unload(levelchunk); // TODO P2
              }

              if (chunk != null) {
                  ++this.chunkCount;
              }
          }
  '''
          new = '''        public void replace(int chunkIndex, @Nullable LevelCube chunk) {
              LevelCube previous = this.chunks.getAndSet(chunkIndex, chunk);
              if (previous == chunk) {
                  return;
              }
              if (previous != null) {
                  --this.chunkCount;
                  this.dropEmptySections(previous);
                  previous.clearAllBlockEntities();
                  if (this.level instanceof CubicClientLevel cubicLevel) {
                      cubicLevel.cc_onCubeUnloaded(previous.cc_getCubePos());
                  }
              }

              if (chunk != null) {
                  ++this.chunkCount;
                  this.addEmptySections(chunk);
                  if (this.level instanceof CubicClientLevel cubicLevel) {
                      cubicLevel.cc_onCubeLoaded(chunk.cc_getCubePos());
                  }
              }
          }
  '''
          if old not in text:
              raise SystemExit("ClientCubeCache.replace source block not found")
          text = text.replace(old, new)
          old = '''        public void drop(int chunkIndex, LevelCube chunk) {
              if (this.chunks.compareAndSet(chunkIndex, chunk, null)) {
                  this.chunkCount--;
                  this.dropEmptySections(chunk);
              }

  //            this.level.unload(chunk); // TODO P2
          }
  '''
          new = '''        public void drop(int chunkIndex, LevelCube chunk) {
              if (this.chunks.compareAndSet(chunkIndex, chunk, null)) {
                  this.chunkCount--;
                  this.dropEmptySections(chunk);
                  chunk.clearAllBlockEntities();
                  if (this.level instanceof CubicClientLevel cubicLevel) {
                      cubicLevel.cc_onCubeUnloaded(chunk.cc_getCubePos());
                  }
              }
          }
  '''
          if old not in text:
              raise SystemExit("ClientCubeCache.drop source block not found")
          text = text.replace(old, new)
          text = text.replace(
              '''                } else if (this.loadedEmptySections.remove(i)) {
  //                    ClientChunkCache.this.level.onSectionBecomingNonEmpty(i); // TODO P2
                  }
  ''',
              '''                } else if (this.loadedEmptySections.remove(i)) {
                      this.level.onSectionBecomingNonEmpty(i);
                  }
  ''',
          )
          text = text.replace(
              '''                        } else if (this.loadedEmptySections.remove(sectionPosLong)) {
  //                            ClientChunkCache.this.level.onSectionBecomingNonEmpty(sectionPosLong); // TODO P2
                          }
  ''',
              '''                        } else if (this.loadedEmptySections.remove(sectionPosLong)) {
                              this.level.onSectionBecomingNonEmpty(sectionPosLong);
                          }
  ''',
          )
          path.write_text(text)

          # Storage now sends the load notification exactly once, so remove the duplicate packet callback.
          replace(
              "src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/client/multiplayer/MixinClientChunkCache.java",
              "\n            ((CubicClientLevel) this.level).cc_onCubeLoaded(cubePos);\n            // TODO event hook\n",
              "\n            // TODO event hook\n",
          )

          # Real client lifecycle bridge. Vanilla entity/light storage is column-based, so reference-count
          # every vanilla column covered by loaded cubes instead of starting/stopping it per packet.
          Path("src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/client/multiplayer/MixinClientLevel.java").write_text('''package io.github.opencubicchunks.cubicchunks.mixin.core.client.multiplayer;

  import io.github.opencubicchunks.cc_core.api.CubePos;
  import io.github.opencubicchunks.cc_core.api.CubicConstants;
  import io.github.opencubicchunks.cc_core.utils.Coords;
  import io.github.opencubicchunks.cubicchunks.client.multiplayer.ClientCubeAvailability;
  import io.github.opencubicchunks.cubicchunks.client.multiplayer.ClientCubeCache;
  import io.github.opencubicchunks.cubicchunks.client.multiplayer.CubicClientLevel;
  import io.github.opencubicchunks.cubicchunks.mixin.core.common.world.level.MixinLevel;
  import it.unimi.dsi.fastutil.longs.Long2IntOpenHashMap;
  import it.unimi.dsi.fastutil.objects.Object2ObjectArrayMap;
  import net.minecraft.client.color.block.BlockTintCache;
  import net.minecraft.client.multiplayer.ClientChunkCache;
  import net.minecraft.client.multiplayer.ClientLevel;
  import net.minecraft.world.entity.Entity;
  import net.minecraft.world.level.ChunkPos;
  import net.minecraft.world.level.ColorResolver;
  import net.minecraft.world.level.entity.TransientEntitySectionManager;
  import org.spongepowered.asm.mixin.Final;
  import org.spongepowered.asm.mixin.Mixin;
  import org.spongepowered.asm.mixin.Shadow;
  import org.spongepowered.asm.mixin.Unique;

  @Mixin(ClientLevel.class)
  public abstract class MixinClientLevel extends MixinLevel implements CubicClientLevel {
      @Shadow @Final private ClientChunkCache chunkSource;
      @Shadow @Final private TransientEntitySectionManager<Entity> entityStorage;
      @Shadow @Final private Object2ObjectArrayMap<ColorResolver, BlockTintCache> tintCaches;

      @Unique private final Long2IntOpenHashMap cc_loadedCubeColumns = new Long2IntOpenHashMap();

      @Override public boolean cc_hasCube(int cubeX, int cubeY, int cubeZ) {
          return ClientCubeAvailability.hasCube((ClientCubeCache) this.chunkSource, cubeX, cubeY, cubeZ);
      }

      @Override public void cc_onCubeLoaded(CubePos cubePos) {
          for (int dx = 0; dx < CubicConstants.DIAMETER_IN_SECTIONS; ++dx) {
              for (int dz = 0; dz < CubicConstants.DIAMETER_IN_SECTIONS; ++dz) {
                  int chunkX = Coords.cubeToSection(cubePos.getX(), dx);
                  int chunkZ = Coords.cubeToSection(cubePos.getZ(), dz);
                  this.tintCaches.forEach((resolver, cache) -> cache.invalidateForChunk(chunkX, chunkZ));
                  long chunkPosLong = ChunkPos.asLong(chunkX, chunkZ);
                  int previousCount = this.cc_loadedCubeColumns.addTo(chunkPosLong, 1);
                  if (previousCount == 0) {
                      ChunkPos chunkPos = new ChunkPos(chunkX, chunkZ);
                      this.entityStorage.startTicking(chunkPos);
                      this.chunkSource.getLightEngine().setLightEnabled(chunkPos, true);
                  }
              }
          }
      }

      @Override public void cc_onCubeUnloaded(CubePos cubePos) {
          for (int dx = 0; dx < CubicConstants.DIAMETER_IN_SECTIONS; ++dx) {
              for (int dz = 0; dz < CubicConstants.DIAMETER_IN_SECTIONS; ++dz) {
                  int chunkX = Coords.cubeToSection(cubePos.getX(), dx);
                  int chunkZ = Coords.cubeToSection(cubePos.getZ(), dz);
                  long chunkPosLong = ChunkPos.asLong(chunkX, chunkZ);
                  int previousCount = this.cc_loadedCubeColumns.get(chunkPosLong);
                  if (previousCount <= 1) {
                      this.cc_loadedCubeColumns.remove(chunkPosLong);
                      ChunkPos chunkPos = new ChunkPos(chunkX, chunkZ);
                      this.chunkSource.getLightEngine().setLightEnabled(chunkPos, false);
                      this.entityStorage.stopTicking(chunkPos);
                  } else {
                      this.cc_loadedCubeColumns.put(chunkPosLong, previousCount - 1);
                  }
              }
          }
      }

      @Override public ClientCubeCache cc_getCubeSource() {
          return (ClientCubeCache) this.chunkSource;
      }
  }
  ''')

          # Make the generated holder's real cube lookup part of its public cubic contract.
          path = Path("src/main/java/io/github/opencubicchunks/cubicchunks/server/level/GenerationCloHolder.java")
          text = path.read_text()
          text = text.replace(
              "import io.github.opencubicchunks.cubicchunks.world.level.cube.ImposterProtoCube;\n",
              "import io.github.opencubicchunks.cubicchunks.world.level.cube.CubeAccess;\n"
              "import io.github.opencubicchunks.cubicchunks.world.level.cube.ImposterProtoCube;\n"
              "import net.minecraft.world.level.chunk.status.ChunkStatus;\n",
          )
          text = text.replace(
              "    void cc_replaceProtoCube(ImposterProtoCube cube);\n",
              "    void cc_replaceProtoCube(ImposterProtoCube cube);\n\n"
              "    @Nullable CubeAccess cc_getCubeIfPresentUnchecked(ChunkStatus status);\n",
          )
          path.write_text(text)

          # Server cube lighting lookup, spawning, light-change broadcast and forced-cube descriptor.
          path = Path("src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/common/server/level/MixinServerChunkCache.java")
          text = path.read_text()
          text = text.replace(
              "import io.github.opencubicchunks.cubicchunks.server.level.ServerCubeCache;\n",
              "import io.github.opencubicchunks.cubicchunks.server.level.GenerationCloHolder;\n"
              "import io.github.opencubicchunks.cubicchunks.server.level.ServerCubeCache;\n",
          )
          old = '''    // TODO (P2) - lighting; currently unused. can probably be done with dasm and @AddUnusedParam
      public @Nullable LightChunk cc_getCubeForLighting(int pChunkX, int chunkY, int pChunkZ) {
          throw new UnsupportedOperationException("not yet implemented");
      }
  '''
          new = '''    public @Nullable LightChunk cc_getCubeForLighting(int cubeX, int cubeY, int cubeZ) {
          ChunkHolder holder = this.getVisibleChunkIfPresent(CloPos.cubeAsLong(cubeX, cubeY, cubeZ));
          if (holder == null) {
              return null;
          }
          return ((GenerationCloHolder) holder).cc_getCubeIfPresentUnchecked(ChunkStatus.INITIALIZE_LIGHT.getParent());
      }
  '''
          if old not in text:
              raise SystemExit("Server cube lighting lookup block not found")
          text = text.replace(old, new)
          old = '''    @AddMethodToSets(containers = ChunkToCloSet.ServerChunkCache_redirects.class, method = "tickSpawningChunk(Lnet/minecraft/world/level/chunk/LevelChunk;JLjava/util/List;"
              + "Lnet/minecraft/world/level/NaturalSpawner$SpawnState;)V")
      private void cc_tickSpawningClo(LevelClo levelClo, long timeInhabited, List<MobCategory> spawnCategories, NaturalSpawner.SpawnState spawnState) {
          // TODO (P2)
      }
  '''
          new = '''    @AddTransformToSets(ChunkToCloSet.ServerChunkCache_redirects.class)
      @TransformFromMethod(useRedirectSets = ChunkToCloSet.class, owner = @Ref(ServerChunkCache.class),
              value = "tickSpawningChunk(Lnet/minecraft/world/level/chunk/LevelChunk;JLjava/util/List;"
                      + "Lnet/minecraft/world/level/NaturalSpawner$SpawnState;)V")
      private native void cc_tickSpawningClo(
              LevelClo levelClo, long timeInhabited, List<MobCategory> spawnCategories, NaturalSpawner.SpawnState spawnState
      );
  '''
          if old not in text:
              raise SystemExit("Server cube spawning block not found")
          text = text.replace(old, new)
          old = '''    @Override @AddMethodToSets(containers = GlobalSet.ServerChunkCache_redirects.class, method = "onLightUpdate(Lnet/minecraft/world/level/LightLayer;Lnet/minecraft/core/SectionPos;)V")
      public void cc_onLightUpdate(LightLayer pType, SectionPos pPos) {
          // TODO (P2) lighting
      }
  '''
          new = '''    @Override @AddMethodToSets(containers = GlobalSet.ServerChunkCache_redirects.class, method = "onLightUpdate(Lnet/minecraft/world/level/LightLayer;Lnet/minecraft/core/SectionPos;)V")
      public void cc_onLightUpdate(LightLayer type, SectionPos sectionPos) {
          this.mainThreadProcessor.execute(() -> {
              CubePos cubePos = CubePos.from(sectionPos);
              ChunkHolder holder = this.getVisibleChunkIfPresent(cubePos.asLong());
              if (holder != null && holder.sectionLightChanged(type, sectionPos.y())) {
                  this.chunkHoldersToBroadcast.add(holder);
              }
          });
      }
  '''
          if old not in text:
              raise SystemExit("Server cube light update block not found")
          text = text.replace(old, new)
          text = text.replace(
              'method = "updateChunkForced(Lnet/minecraft/world/level/ChunkPos;Z)Z\\\""',
              'method = "updateChunkForced(Lnet/minecraft/world/level/ChunkPos;Z)Z"',
          )
          path.write_text(text)

          # Complete LevelCube post-processing and tick container registration.
          path = Path("src/main/java/io/github/opencubicchunks/cubicchunks/world/level/cube/LevelCube.java")
          text = path.read_text().replace(
              "import net.minecraft.world.level.block.EntityBlock;\n",
              "import net.minecraft.world.level.block.EntityBlock;\nimport net.minecraft.world.level.block.LiquidBlock;\n",
          )
          old = '''    // TODO P2 or P3 figure this out later - stub method for now
      public void postProcessGeneration(ServerLevel serverLevel) {
          for (int i = 0; i < this.postProcessing.length; ++i) {
              if (this.postProcessing[i] != null) {
                  this.postProcessing[i].clear();
              }
          }

          for (BlockPos blockpos1 : ImmutableList.copyOf(this.pendingBlockEntities.keySet())) {
              this.getBlockEntity(blockpos1);
          }

          this.pendingBlockEntities.clear();
      }
  '''
          new = '''    public void postProcessGeneration(ServerLevel serverLevel) {
          for (int sectionIndex = 0; sectionIndex < this.postProcessing.length; ++sectionIndex) {
              if (this.postProcessing[sectionIndex] == null) {
                  continue;
              }

              int sectionX = Coords.cubeToSection(this.cubePos.getX(), Coords.indexToX(sectionIndex));
              int sectionY = Coords.cubeToSection(this.cubePos.getY(), Coords.indexToY(sectionIndex));
              int sectionZ = Coords.cubeToSection(this.cubePos.getZ(), Coords.indexToZ(sectionIndex));
              for (short packedPosition : this.postProcessing[sectionIndex]) {
                  int localX = packedPosition & SectionPos.SECTION_MASK;
                  int localY = packedPosition >> 4 & SectionPos.SECTION_MASK;
                  int localZ = packedPosition >> 8 & SectionPos.SECTION_MASK;
                  BlockPos blockPos = new BlockPos(
                          SectionPos.sectionToBlockCoord(sectionX, localX),
                          SectionPos.sectionToBlockCoord(sectionY, localY),
                          SectionPos.sectionToBlockCoord(sectionZ, localZ));
                  BlockState blockState = this.getBlockState(blockPos);
                  FluidState fluidState = blockState.getFluidState();
                  if (!fluidState.isEmpty()) {
                      fluidState.tick(serverLevel, blockPos, blockState);
                  }
                  if (!(blockState.getBlock() instanceof LiquidBlock)) {
                      BlockState updatedState = Block.updateFromNeighbourShapes(blockState, serverLevel, blockPos);
                      if (updatedState != blockState) {
                          serverLevel.setBlock(blockPos, updatedState, 276);
                      }
                  }
              }
              this.postProcessing[sectionIndex].clear();
          }

          for (BlockPos blockPos : ImmutableList.copyOf(this.pendingBlockEntities.keySet())) {
              this.getBlockEntity(blockPos);
          }
          this.pendingBlockEntities.clear();
      }
  '''
          if old not in text:
              raise SystemExit("LevelCube post processing block not found")
          text = text.replace(old, new)
          old = '''    // TODO (P2 or P3) ticks are disabled for now; stub methods as placeholders
  //    @TransformFromMethod(value = @MethodSig("registerTickContainerInLevel(Lnet/minecraft/server/level/ServerLevel;)V"), owner = @Ref(LevelChunk
  //    .class))
  //    public native void registerTickContainerInLevel(ServerLevel level);
      public void registerTickContainerInLevel(ServerLevel level) {}

      // @TransformFromMethod(value = @MethodSig("unregisterTickContainerFromLevel(Lnet/minecraft/server/level/ServerLevel;)V"), owner = @Ref
      // (LevelChunk.class))
  //    public native void unregisterTickContainerFromLevel(ServerLevel level);
      public void unregisterTickContainerFromLevel(ServerLevel level) {}
  '''
          new = '''    @TransformFromMethod(value = "registerTickContainerInLevel(Lnet/minecraft/server/level/ServerLevel;)V", owner = @Ref(LevelChunk.class))
      public native void registerTickContainerInLevel(ServerLevel level);

      @TransformFromMethod(value = "unregisterTickContainerFromLevel(Lnet/minecraft/server/level/ServerLevel;)V", owner = @Ref(LevelChunk.class))
      public native void unregisterTickContainerFromLevel(ServerLevel level);
  '''
          if old not in text:
              raise SystemExit("LevelCube tick registration block not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Format and validate transformed source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply test check --stacktrace --no-daemon

      - name: Commit production implementations
        shell: bash
        run: |
          rm .github/workflows/apply-completion-batch1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement cube lifecycle, ticks, spawning, and light routing"
          git push origin HEAD:agent/cubicchunks3-phase1
