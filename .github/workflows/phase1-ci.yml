name: CubicChunks3 Phase 1 CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply development patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in patches/*.patch; do
            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "Already applied: $patch"
            else
              git apply --check "$patch"
              git apply "$patch"
            fi
          done
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Run full checks
        run: ./gradlew check --stacktrace --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-reports
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
          if-no-files-found: ignore
