name: CubicChunks3 Phase 1 CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Apply staged runtime completion patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/runtime-completion.patch ]]; then
            echo 'No staged patch exists; nothing to apply.' >&2
            exit 1
          fi
          git apply --check .github/runtime-completion.patch
          git apply .github/runtime-completion.patch
          rm .github/runtime-completion.patch
          git show HEAD^:.github/workflows/phase1-ci.yml > .github/workflows/phase1-ci.yml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Format production patch
        run: ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Run full checks
        run: ./gradlew check --stacktrace --no-daemon

      - name: Commit validated runtime implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement cube dirty routing, post-processing, and tick registration"
          git push origin HEAD:agent/cubicchunks3-phase1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-runtime-completion-reports
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
          if-no-files-found: ignore
