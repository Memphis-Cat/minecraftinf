name: CubicChunks3 Phase 1 CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply staged production patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ -f .github/completion-large.patch ]]; then
            git apply .github/completion-large.patch
            rm .github/completion-large.patch
            git show HEAD^:.github/workflows/phase1-ci.yml > .github/workflows/phase1-ci.yml
            echo 'STAGED_PATCH_APPLIED=true' >> "$GITHUB_ENV"
          fi

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase1-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !build/**
            !CubicChunksCore/build/**
            !run/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Format staged production patch
        if: env.STAGED_PATCH_APPLIED == 'true'
        run: ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Run full checks
        run: ./gradlew check --stacktrace --no-daemon

      - name: Commit validated production patch
        if: env.STAGED_PATCH_APPLIED == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement cube ticks, spawning, post-processing, and light routing"
          git push origin HEAD:agent/cubicchunks3-phase1

      - name: Inspect Minecraft completion APIs
        if: always()
        shell: bash
        run: bash .github/scripts/inspect-minecraft-storage.sh

      - name: Upload Minecraft completion API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-minecraft-storage-api
          path: build/minecraft-storage-inspection/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-reports
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
          if-no-files-found: ignore

  server-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure smoke-test server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=phase1-smoke-world
          motd=CubicChunks3 Phase 1 Smoke Test
          PROPERTIES

      - name: Start dedicated server and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          : > server-smoke.log
          setsid ./gradlew runServer --stacktrace --no-daemon >server-smoke.log 2>&1 &
          process_group=$!

          cleanup() {
            kill -INT -- "-$process_group" >/dev/null 2>&1 || true
            sleep 5
            kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
            wait "$process_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' server-smoke.log; then
              echo 'Dedicated server reached the ready state.'
              exit 0
            fi

            if ! kill -0 "$process_group" >/dev/null 2>&1; then
              echo 'Dedicated server exited before reaching the ready state.' >&2
              cat server-smoke.log
              exit 1
            fi

            sleep 1
          done

          echo 'Dedicated server did not become ready within six minutes.' >&2
          cat server-smoke.log
          exit 1

      - name: Upload dedicated-server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-server-smoke-logs
          path: |
            server-smoke.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore

  persistence-smoke:
    needs: server-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run cubic save and reload test
        shell: bash
        run: bash .github/scripts/server-persistence-smoke.sh

      - name: Upload persistence logs and world metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-persistence-smoke-logs
          path: |
            server-persistence-first.log
            server-persistence-second.log
            save-flush-rcon.log
            save-flush-processes.txt
            save-flush-thread-*.txt
            run/logs/
            run/crash-reports/
            run/phase1-persistence-world/level.dat
            run/phase1-persistence-world/level.dat_old
            run/phase1-persistence-world/cubicchunks/**
          if-no-files-found: ignore
