name: CubicChunks3 Phase 1 CI

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Apply complete runtime source batch
        id: patch
        run: |
          set -euo pipefail
          chmod +x gradlew
          if compgen -G '.github/cc3-runtime-complete.patch.*' > /dev/null; then
            cat .github/cc3-runtime-complete.patch.* > /tmp/cc3-runtime-complete.patch
            git apply --index /tmp/cc3-runtime-complete.patch
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Format source
        if: steps.patch.outputs.present == 'true'
        run: ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Run CubicChunksCore tests
        if: steps.patch.outputs.present == 'true'
        run: ./gradlew :CubicChunksCore:test --stacktrace --no-daemon

      - name: Run runtime unit tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.test.*'
          --tests 'io.github.opencubicchunks.cubicchunks.world.level.cube.status.TestCubeColumnBridge'
          --stacktrace --no-daemon

      - name: Run ServerCubeCache integration tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestServerCubeCache'
          --stacktrace --no-daemon

      - name: Run bounded ChunkMap integration tests
        if: steps.patch.outputs.present == 'true'
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestCubicChunkMap'
          --stacktrace --no-daemon

      - name: Run formatting and static checks
        if: steps.patch.outputs.present == 'true'
        run: ./gradlew check -x test --stacktrace --no-daemon

      - name: Run dedicated-server save, stop, restart, and reload test
        if: steps.patch.outputs.present == 'true'
        run: bash .github/scripts/server-persistence-smoke.sh

      - name: Commit validated source
        if: steps.patch.outputs.present == 'true'
        run: |
          set -euo pipefail
          git rm .github/cc3-runtime-complete.patch.*
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete cube runtime and persistence paths'
          git push origin HEAD:agent/cubicchunks3-phase1

      - name: Upload validation reports
        if: always() && steps.patch.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase1-complete-runtime-validation
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
            server-persistence-first.log
            server-persistence-second.log
            save-flush-rcon.log
            save-flush-processes.txt
            save-flush-thread-*.txt
            run/logs/
            run/crash-reports/
            run/phase1-persistence-world/cubicchunks/**
          if-no-files-found: ignore
          retention-days: 7
