name: CubicChunks3 Phase 1 CI

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run CubicChunksCore tests
        run: ./gradlew :CubicChunksCore:test --stacktrace --no-daemon

      - name: Run unit tests in an isolated JVM
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.test.*'
          --tests 'io.github.opencubicchunks.cubicchunks.world.level.cube.status.TestCubeColumnBridge'
          --stacktrace --no-daemon

      - name: Run ServerCubeCache integration tests in an isolated JVM
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestServerCubeCache'
          --stacktrace --no-daemon

      - name: Run ChunkMap integration tests in an isolated JVM
        run: >-
          ./gradlew test
          --tests 'io.github.opencubicchunks.cubicchunks.integrationtest.server.level.IntegrationTestCubicChunkMap'
          --stacktrace --no-daemon

      - name: Run formatting and static checks
        run: ./gradlew check -x test --stacktrace --no-daemon

      - name: Inspect Minecraft completion APIs
        if: always()
        run: bash .github/scripts/inspect-minecraft-storage.sh

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-reports
          path: |
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
            build/minecraft-storage-inspection/
          if-no-files-found: ignore
          retention-days: 7

  server-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure smoke-test server
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          level-name=phase1-smoke-world
          motd=CubicChunks3 Phase 1 Smoke Test
          PROPERTIES

      - name: Start dedicated server and wait for readiness
        run: |
          set -euo pipefail
          : > server-smoke.log
          setsid ./gradlew runServer --stacktrace --no-daemon >server-smoke.log 2>&1 &
          process_group=$!
          cleanup() {
            kill -INT -- "-$process_group" >/dev/null 2>&1 || true
            sleep 5
            kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
            wait "$process_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 360); do
            if grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' server-smoke.log; then
              exit 0
            fi
            if ! kill -0 "$process_group" >/dev/null 2>&1; then
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done
          cat server-smoke.log
          exit 1

      - name: Upload dedicated-server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-server-smoke-logs
          path: |
            server-smoke.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7

  persistence-smoke:
    needs: server-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run cubic save, stop, restart, and reload test
        run: bash .github/scripts/server-persistence-smoke.sh

      - name: Upload persistence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-persistence-smoke-logs
          path: |
            server-persistence-first.log
            server-persistence-second.log
            save-flush-rcon.log
            save-flush-processes.txt
            save-flush-thread-*.txt
            run/logs/
            run/crash-reports/
            run/phase1-persistence-world/cubicchunks/**
          if-no-files-found: ignore
          retention-days: 7
