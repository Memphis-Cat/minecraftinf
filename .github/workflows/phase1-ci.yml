name: CubicChunks3 Runtime Source Integration

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: cubicchunks3-runtime-source-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Apply deterministic runtime implementation
        run: |
          python .github/scripts/apply-runtime-completion.py
          python .github/scripts/fix-runtime-tests.py
          python .github/scripts/fix-runtime-access.py
          python .github/scripts/fix-cubic-ticks.py
          python .github/scripts/fix-cubic-tick-fixture.py
          python .github/scripts/optimize-generation-matrix.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Format and verify integrated source
        run: |
          ./gradlew spotlessApply --stacktrace --no-daemon
          ./gradlew build -x test --stacktrace --no-daemon

      - name: Commit real source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/runtime-completion.patch \
                .github/scripts/apply-runtime-completion.py \
                .github/scripts/fix-runtime-tests.py \
                .github/scripts/fix-runtime-access.py \
                .github/scripts/fix-cubic-ticks.py \
                .github/scripts/fix-cubic-tick-fixture.py \
                .github/scripts/optimize-generation-matrix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/phase1-ci.yml
          git commit -m "Integrate cube runtime implementation into source [skip ci]"
          git push origin HEAD:agent/cubicchunks3-phase1
