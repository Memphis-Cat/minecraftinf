name: CubicChunks3 Runtime Completion Apply

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: cubicchunks3-runtime-completion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Apply deterministic source edits
        run: python .github/scripts/apply-runtime-completion.py

      - name: Fix integration generator fixture
        run: python .github/scripts/fix-runtime-tests.py

      - name: Fix runtime access contracts and test invariants
        run: python .github/scripts/fix-runtime-access.py

      - name: Implement cubic scheduled tick storage
        run: python .github/scripts/fix-cubic-ticks.py

      - name: Use cubic tick stores in integration server fixture
        run: python .github/scripts/fix-cubic-tick-fixture.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Format source
        run: ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Run unit and integration tests with stall diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/runtime-test-logging.gradle <<'GRADLE'
          allprojects {
            tasks.withType(Test).configureEach {
              testLogging {
                exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
                showCauses = true
                showStackTraces = true
              }
            }
          }
          GRADLE
          : > runtime-test.log
          setsid ./gradlew test -I /tmp/runtime-test-logging.gradle --stacktrace --no-daemon >runtime-test.log 2>&1 &
          process_group=$!

          terminate_group() {
            kill -TERM -- "-$process_group" >/dev/null 2>&1 || true
            sleep 3
            kill -KILL -- "-$process_group" >/dev/null 2>&1 || true
          }
          dump_threads() {
            ps -eo pid,ppid,pgid,stat,etime,cmd > runtime-test-processes.txt
            for pid in $(jps -q 2>/dev/null || true); do
              jcmd "$pid" Thread.print -l > "runtime-test-thread-${pid}.txt" 2>&1 || true
            done
          }
          trap terminate_group EXIT

          for _ in $(seq 1 600); do
            if grep -Eq '^[^[:space:]].* FAILED$|^> Task :test FAILED$' runtime-test.log; then
              sleep 5
              dump_threads
              cat runtime-test.log
              terminate_group
              trap - EXIT
              exit 1
            fi
            if ! kill -0 "$process_group" >/dev/null 2>&1; then
              wait "$process_group"
              trap - EXIT
              exit 0
            fi
            sleep 1
          done

          dump_threads
          echo 'Runtime tests exceeded ten minutes.' >&2
          terminate_group
          trap - EXIT
          exit 124

      - name: Run full checks
        run: ./gradlew check --stacktrace --no-daemon

      - name: Run real save, stop, restart, and reload test
        run: bash .github/scripts/server-persistence-smoke.sh

      - name: Commit validated runtime implementation
        run: |
          rm -f .github/runtime-completion.patch \
                .github/scripts/apply-runtime-completion.py \
                .github/scripts/fix-runtime-tests.py \
                .github/scripts/fix-runtime-access.py \
                .github/scripts/fix-cubic-ticks.py \
                .github/scripts/fix-cubic-tick-fixture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete cube runtime routing and remove scheduler deadlock"
          git push origin HEAD:agent/cubicchunks3-phase1

      - name: Upload reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-completion-validation
          path: |
            runtime-test.log
            runtime-test-processes.txt
            runtime-test-thread-*.txt
            build/reports/
            build/test-results/
            CubicChunksCore/build/reports/
            CubicChunksCore/build/test-results/
            server-persistence-first.log
            server-persistence-second.log
            save-flush-rcon.log
            save-flush-thread-*.txt
            run/logs/
            run/crash-reports/
            run/phase1-persistence-world/cubicchunks/**
          if-no-files-found: ignore
