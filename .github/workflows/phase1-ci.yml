name: CubicChunks3 Phase 1 CI

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cubicchunks3-phase1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose-persistence-shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply validated runtime fixes and diagnostics
        run: |
          set -euo pipefail
          chmod +x gradlew
          python .github/cc3-protocube-unload.patch
          python .github/cc3-stop-diagnostic.py
          ./gradlew spotlessApply --stacktrace --no-daemon

      - name: Reproduce save, stop, restart, and reload path
        run: bash .github/scripts/server-persistence-smoke.sh

      - name: Upload shutdown diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-shutdown-diagnostics
          path: |
            server-persistence-first.log
            server-persistence-second.log
            save-flush-rcon.log
            save-flush-processes.txt
            save-flush-thread-*.txt
            run/logs/
            run/crash-reports/
            run/phase1-persistence-world/cubicchunks/**
          if-no-files-found: ignore
          retention-days: 7
