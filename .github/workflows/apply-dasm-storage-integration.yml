name: Apply DASM Storage Integration

on:
  push:
    branches:
      - agent/cubicchunks3-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch and submodules
        uses: actions/checkout@v4
        with:
          ref: agent/cubicchunks3-phase1
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply and format storage integration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check patches/0003-integrate-storage-into-chunkmap.patch
          git apply patches/0003-integrate-storage-into-chunkmap.patch
          ./gradlew spotlessApply --no-daemon

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/common/server/level/MixinChunkMap.java
          git rm src/main/java/io/github/opencubicchunks/cubicchunks/mixin/core/common/server/level/MixinChunkMapCubeStorage.java
          git rm patches/0003-integrate-storage-into-chunkmap.patch
          git rm .github/workflows/apply-dasm-storage-integration.yml
          git commit -m 'Integrate cube persistence into DASM ChunkMap'
          git push origin HEAD:agent/cubicchunks3-phase1
