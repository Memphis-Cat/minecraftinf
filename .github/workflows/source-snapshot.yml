name: Source Snapshot

on:
  push:
    branches:
      - agent/**

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cubicchunks3-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !build/**
            !CubicChunksCore/build/**
            !run/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
